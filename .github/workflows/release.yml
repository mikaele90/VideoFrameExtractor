name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --icon=app.ico --name VideoFrameExtractor video_comparison_app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoFrameExtractor-windows
          path: dist/VideoFrameExtractor.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: VideoFrameExtractor-windows

      - name: Create source archive
        run: |
          zip -r VideoFrameExtractor-source.zip . -x ".git/*" -x ".github/*" -x ".venv/*" -x "__pycache__/*" -x "*.pyc" -x ".claude/*"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            VideoFrameExtractor.exe
            VideoFrameExtractor-source.zip
          generate_release_notes: true
