name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --icon=app.ico --name VideoFrameExtractor video_comparison_app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoFrameExtractor-windows
          path: dist/VideoFrameExtractor.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: VideoFrameExtractor-windows

      - name: Install 7-Zip
        run: sudo apt-get install -y p7zip-full

      - name: Create release package
        run: |
          # Create versioned folder (e.g., VideoFrameExtractor_v0.4.1)
          FOLDER_NAME="VideoFrameExtractor_${{ github.ref_name }}"
          mkdir -p "$FOLDER_NAME"

          # Copy executable to folder
          mv VideoFrameExtractor.exe "$FOLDER_NAME/"

          # Create default config.json with empty settings
          echo '{}' > "$FOLDER_NAME/config.json"

          # Create 7z archive with maximum compression
          7z a -mx=9 "${FOLDER_NAME}.7z" "$FOLDER_NAME"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: VideoFrameExtractor_${{ github.ref_name }}.7z
          generate_release_notes: true
